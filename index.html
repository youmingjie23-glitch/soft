<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心動相親配對網</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #fdf2f4; margin: 0; padding: 30px 20px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; text-align: center; }
        h1 { color: #d81b60; font-size: 2.2rem; margin-bottom: 5px; }
        p.subtitle { color: #888; font-size: 1rem; margin-bottom: 25px; }
        .filter-btn { background: #ffffff; border: 1px solid #f48fb1; color: #d81b60; padding: 8px 18px; margin: 0 5px; border-radius: 20px; cursor: pointer; font-size: 0.95rem; font-weight: bold; transition: 0.2s; }
        .filter-btn:hover, .filter-btn.active { background: #d81b60; color: #fff; border-color: #d81b60; }
        .card-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .card { background: white; border-radius: 16px; padding: 25px; width: 240px; box-shadow: 0 8px 20px rgba(216, 27, 96, 0.08); border: 1px solid #f8bbd0; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .avatar { width: 70px; height: 70px; background: #ffe0b2; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
        .card h3 { margin: 5px 0 10px; color: #222; font-size: 1.2rem; }
        .tags { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
        .tag { background: #fce4ec; color: #c2185b; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 500; }
        .bio { font-size: 0.9rem; color: #666; line-height: 1.4; margin-bottom: 20px; min-height: 50px; text-align: left; }
        .like-btn { background: #e91e63; color: white; border: none; padding: 10px; border-radius: 10px; cursor: pointer; font-size: 0.95rem; font-weight: bold; width: 100%; transition: 0.2s; }
        .like-btn:hover { background: #c2185b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💕 心動相親配對網</h1>
        <p class="subtitle">為你尋找最合適的另一半</p>
        
        <div>
            <button class="filter-btn active" onclick="filterGender('all', this)">全部會員</button>
            <button class="filter-btn" onclick="filterGender('女', this)">只看女性</button>
            <button class="filter-btn" onclick="filterGender('男', this)">只看男性</button>
        </div>

        <div class="card-grid" id="cardGrid"></div>
    </div>

    <script>
       // 1. 設定你的圖片相對路徑（假設你放在 images 資料夾下）
        const profiles = [
            {
                "id": 1, 
                "name": "里卡多·米洛斯", 
                "gender": "男", 
                "age": 25, 
                "occupation": "演員", 
                "avatar": "images/里卡多·米洛斯.jpg", // 👈 修改為你的圖片檔名
                "bio": "喜歡跳舞，尋找有幽默感的另一半。"
            },
            {
                "id": 2, 
                "name": "田所浩二", 
                "gender": "男", 
                "age": 28, 
                "occupation": "演員", 
                "avatar": "images/野獸.png",  // 👈 修改為你的圖片檔名
                "bio": "熱愛唱歌與演戲，希望能找到一起旅行的夥伴。"
            },
            {
                "id": 3, 
                "name": "鄧佳華", 
                "gender": "男", 
                "age": 27, 
                "occupation": "網紅", 
                "avatar": "images/鄧佳華.jpg", // 👈 修改為你的圖片檔名
                "bio": "平時喜歡挑戰新事物，性格溫和好相處。"
            },
            {
                "id": 4, 
                "name": "葉玫瑰", 
                "gender": "女", 
                "age": 34, 
                "occupation": "網紅", 
                "avatar": "images/葉玫瑰.jpg", // 👈 修改為你的圖片檔名
                "bio": "平時喜歡拍照，性格老實。"
            },
            {
                "id": 5, 
                "name": "范育青", 
                "gender": "女", 
                "age": 25, 
                "occupation": "網紅", 
                "avatar": "images/范育青.jpg", // 👈 修改為你的圖片檔名
                "bio": "平時喜歡記錄生活，極度渴望另一半。"
            }
        ];

        // 2. 修改渲染卡片的 HTML，改為讀取 <img> 標籤
        function renderProfiles(list) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = list.map(person => `
                <div class="card">
                    <div>
                        <div class="avatar">
                            <img src="${person.avatar}" alt="${person.name}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                        </div>
                        <h3>${person.name} (${person.age}歲)</h3>
                        <div class="tags">
                            <span class="tag">${person.gender}</span>
                            <span class="tag">${person.occupation}</span>
                        </div>
                        <p class="bio">${person.bio}</p>
                    </div>
                    <button class="like-btn" onclick="sendHeart('${person.name}')">💖 發送心動</button>
                </div>
            `).join('');
        }

        function filterGender(gender, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if (gender === 'all') {
                renderProfiles(profiles);
            } else {
                renderProfiles(profiles.filter(p => p.gender === gender));
            }
        }

        function sendHeart(name) {
            alert('已成功向 ' + name + ' 發送心動訊號！💕');
        }

        // 初始渲染
        renderProfiles(profiles);
    </script>
</body>
</html>
